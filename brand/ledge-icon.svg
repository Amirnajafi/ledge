<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6CF6"/>
      <stop offset="0.55" stop-color="#3B2F9E"/>
      <stop offset="1" stop-color="#14112E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#B9B0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B9B0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A0820" flood-opacity="0.45"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- squircle base -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- wallpaper-like light ribbon -->
    <path d="M60 860 C 360 700, 520 420, 980 300" stroke="#C9C2FF" stroke-opacity="0.18" stroke-width="70" fill="none"/>
    <!-- top sheen -->
    <rect x="100" y="100" width="824" height="330" fill="url(#sheen)" opacity="0.35"/>
  </g>

  <!-- the ledge: a glass dock hugging the left edge -->
  <g filter="url(#shadow)">
    <rect x="196" y="252" width="168" height="520" rx="84" fill="url(#glass)"/>
    <rect x="196" y="252" width="168" height="520" rx="84" fill="none" stroke="url(#rim)" stroke-width="5"/>
  </g>
  <!-- tools: mic (live, coral), then two quiet dots -->
  <circle cx="280" cy="372" r="30" fill="#FF7A6B"/>
  <circle cx="280" cy="512" r="26" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="280" cy="652" r="26" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- expand chevron -->
  <path d="M560 380 L692 512 L560 644" fill="none" stroke="#FFFFFF" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
